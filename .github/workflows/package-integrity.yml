name: Package integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run package verifier tests
        run: npm test

      - name: Create release ZIP with Electron Forge
        run: npm run make -- --targets=@electron-forge/maker-zip --platform=linux --arch=x64

      - name: Verify packaged application
        run: npm run verify:package -- out/chatd-linux-x64

      - name: Verify release ZIP
        run: unzip -t out/make/zip/linux/x64/*.zip
